server {
    listen 80;
    server_name api.yiiling.cn;

    # Body size cap — covers debug-snapshot endpoint (raw PNG up to 12MB)
    # plus telemetry (12MB JSONL). Default nginx limit is 1MB which 413s
    # any sizeable upload before it reaches the backend.
    client_max_body_size 20m;

    # Forward everything to the backend container.
    # certbot --nginx will inject SSL config into this server block when run.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
