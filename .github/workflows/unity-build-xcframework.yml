name: Build UnityFramework.xcframework

on:
  push:
    paths:
      - 'UnityARLib/**'
      - '.github/workflows/unity-build-xcframework.yml'
  workflow_dispatch:

# Serialize concurrent runs to prevent two parallel workflows from racing
# on the unity-release.json marker commit (which would cause one's
# git push to be rejected and rebase-conflict on the marker file).
# Setting cancel-in-progress: false ensures the running build completes
# (xcframework gets uploaded) before the next one starts.
concurrency:
  group: unity-xcframework-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Job 1: Unity iOS export (Linux + Docker, game-ci) ──────────────────────
  unity-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # v187.7.11 — Pre-build STATIC GATE.
      # Subagent A diagnosed empty m_RendererFeatures in CairnURPRenderer.asset
      # as the v187 yellow-screen root cause. Subagent B identified the residual
      # 30% risk: CI Unity version (6000.0.36f1) ≠ project version (6000.0.76f1)
      # could silently corrupt URP renderer-feature serialization between Unity
      # patches. Defense: grep the .asset YAML before unity-builder runs; fail
      # the workflow if the feature is missing. Costs ~1 second; saves a 6-min
      # build + an EAS build cycle when the renderer is broken.
      - name: Pre-build static gate (assets sanity)
        run: |
          set -e
          echo "==== Pre-build static gate ===="
          # ARBackgroundRendererFeature MonoBehaviour script GUID is
          # 0ae4d376c05df421b98c5b39b25b0d29 (constant across Unity 6 patches).
          if ! grep -q '0ae4d376c05df421b98c5b39b25b0d29' UnityARLib/Assets/Settings/CairnURPRenderer.asset 2>/dev/null; then
            echo "::error::CairnURPRenderer.asset does not contain ARBackgroundRendererFeature script GUID (0ae4d376...). YELLOW-SCREEN BUG WILL RECUR. Aborting build."
            exit 1
          fi
          # And the m_RendererFeatures list must reference it (not just have
          # it as an orphan sub-asset).
          # Note: m_RendererFeatures is indented 2 spaces inside the
          # MonoBehaviour block, so we need -E + ^\s* (not anchored ^m_).
          # Also: fileID must be non-zero (fileID: 0 = orphan stub).
          if ! grep -A2 -E '^\s*m_RendererFeatures:' UnityARLib/Assets/Settings/CairnURPRenderer.asset | grep -qE '^\s*-\s*\{fileID:\s*-?[1-9][0-9]*\}'; then
            echo "::error::CairnURPRenderer.asset has empty m_RendererFeatures list (or fileID=0 orphan). YELLOW-SCREEN BUG WILL RECUR. Aborting build."
            exit 1
          fi
          # Project vs CI Unity version — flag mismatch (warning only; image
          # publication lag for 76f1 means we cannot fail on this YET).
          # CI version is the literal string passed to unity-builder below;
          # avoid grepping this workflow file itself (catches the grep -E
          # arg line and parses '-E' as the version).
          PROJ_VER=$(grep -E '^m_EditorVersion:' UnityARLib/ProjectSettings/ProjectVersion.txt | awk '{print $2}')
          CI_VER="6000.0.36f1"
          if [ "$PROJ_VER" != "$CI_VER" ]; then
            echo "::warning::Unity version mismatch: project=$PROJ_VER, CI=$CI_VER. Risk of serialization drift. Static gate above protects against the most-known case (URP renderer features) but other Unity 6 patch differences may leak through."
          else
            echo "Unity version: project=$PROJ_VER, CI=$CI_VER (match)."
          fi
          echo "==== Pre-build static gate PASS ===="

      # v187.7.12 — Strategy B (no version unification). Project is 76f1
      # locally; CI is 36f1 (game-ci has not published 76f1 image yet).
      # Risk: cross-patch URP/SerializedObject drift could silently corrupt
      # asset YAML during scene-build. Mitigation: emit SHA-256 of every
      # rendering-critical asset on BOTH sides, compare in pre-EAS gate.
      - name: Emit asset fingerprints (drift monitor)
        run: |
          # Note: do NOT chmod +x — that dirties the working tree, and
          # unity-builder's allowDirtyBuild=false rejects the build.
          # `bash <script>` doesn't require execute permission.
          bash tools/asset-fingerprint.sh

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.36f1
          targetPlatform: iOS
          buildMethod: BuildScript.BuildIOS
          projectPath: UnityARLib
          buildsPath: builds
          allowDirtyBuild: false

      # v186 diagnostic: capture Unity Editor.log on failure so we can
      # actually see compile errors / SetupAndSave exceptions / etc.
      # Without this, a failed Unity build leaves no actionable
      # diagnostics in the GitHub Actions UI for non-admin viewers.
      # `if: always()` runs even when the previous step failed.
      - name: Upload Unity Editor logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editor-logs
          path: |
            /home/runner/.config/unity3d/Editor.log
            /github/home/.config/unity3d/Editor.log
            UnityARLib/Logs/
            ~/.config/unity3d/Editor.log
            ~/Library/Logs/Unity/Editor.log
          retention-days: 7
          if-no-files-found: warn

      - name: Locate Unity build output
        run: |
          echo "=== Looking for Unity iOS export ==="
          find . -maxdepth 4 -name "Unity-iPhone.xcodeproj" -type d 2>/dev/null || true
          echo "=== UnityARLib/builds/ contents ==="
          ls -la UnityARLib/builds/ 2>/dev/null || echo "no UnityARLib/builds/"
          echo "=== ./builds/ contents ==="
          ls -la builds/ 2>/dev/null || echo "no ./builds/"

      - uses: actions/upload-artifact@v4
        with:
          name: unity-ios-export
          path: |
            UnityARLib/builds/iOS/
            builds/iOS/
          retention-days: 1
          if-no-files-found: error

  # ── Job 2: xcodebuild → xcframework (macOS required) ───────────────────────
  build-xcframework:
    runs-on: macos-14
    needs: unity-export
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: unity-ios-export
          path: ios-export/

      - name: Locate downloaded Xcode project
        id: locate
        run: |
          XPROJ=$(find ios-export -name "Unity-iPhone.xcodeproj" -type d | head -1)
          if [ -z "$XPROJ" ]; then
            echo "ERROR: No Unity-iPhone.xcodeproj in artifact"
            find ios-export -maxdepth 4 -type d
            exit 1
          fi
          XDIR=$(dirname "$XPROJ")
          echo "Found at: $XDIR"
          echo "xcode_dir=$XDIR" >> $GITHUB_OUTPUT

      - name: Build UnityFramework.xcframework
        run: |
          set -e

          PROJ="${{ steps.locate.outputs.xcode_dir }}/Unity-iPhone.xcodeproj"

          # List available schemes
          echo "=== Available schemes ==="
          xcodebuild -project "$PROJ" -list 2>&1 || true

          # Archive UnityFramework scheme (NOT Unity-iPhone app scheme)
          xcodebuild archive \
            -project "$PROJ" \
            -scheme UnityFramework \
            -configuration Release \
            -sdk iphoneos \
            -archivePath /tmp/UnityFramework.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tail -20

          # Find the compiled framework inside the archive
          FRAMEWORK_PATH=$(find /tmp/UnityFramework.xcarchive \
            -name "UnityFramework.framework" -type d | head -1)

          if [ -z "$FRAMEWORK_PATH" ]; then
            echo "ERROR: UnityFramework.framework not found in archive"
            find /tmp/UnityFramework.xcarchive -type d | head -20
            exit 1
          fi

          echo "Framework found at: $FRAMEWORK_PATH"

          # Create xcframework (device-only for Spike; add simulator slice later if needed)
          xcodebuild -create-xcframework \
            -framework "$FRAMEWORK_PATH" \
            -output UnityFramework.xcframework

          zip -r UnityFramework.xcframework.zip UnityFramework.xcframework
          echo "=== xcframework size ==="
          du -sh UnityFramework.xcframework.zip

      - name: Verify sendMessageToMobileApp symbol exported
        run: |
          set -e
          BIN="UnityFramework.xcframework/ios-arm64/UnityFramework.framework/UnityFramework"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: Framework binary missing at $BIN"
            exit 1
          fi
          echo "=== Looking for sendMessageToMobileApp in symbol table ==="
          # nm -gU lists EXTERNAL DEFINED symbols (uppercase = exported)
          if ! nm -gU "$BIN" 2>&1 | grep -q "_sendMessageToMobileApp"; then
            echo "ERROR: sendMessageToMobileApp NOT exported from UnityFramework binary"
            echo "This means Unity -> RN bridge will silently fail at runtime."
            echo ""
            echo "All exported C symbols (looking for context):"
            nm -gU "$BIN" 2>&1 | head -20
            exit 1
          fi
          echo "=== sendMessageToMobileApp IS exported ==="
          nm -gU "$BIN" 2>&1 | grep "sendMessageToMobileApp"

      - name: Update EAS fingerprint marker
        # Commits app/unity-release.json with the SHA-256 of the published
        # xcframework zip. This file is hashed by expo-fingerprint
        # (configured via app/fingerprint.config.js extraSources), so a new
        # Unity binary forces EAS to do a fresh native build instead of a
        # JS-only "repack". Without this, EAS reuses the cached IPA's old
        # UnityFramework binary even when the GitHub Release has new content.
        #
        # ORDERING: this step runs BEFORE GitHub Release upload. If marker
        # commit fails (push rejected, conflict), the workflow fails AND
        # the new Release is NOT published — preventing the silent-stale
        # state where Release has new binary but marker is stale, causing
        # EAS to ship cached old binary unaware. With this ordering,
        # Release publish is gated on successful marker propagation.
        #
        # NOTE: Info-ZIP is non-deterministic (embeds mtimes), so re-running
        # workflow on identical Unity source produces a new SHA → new
        # marker commit → cache invalidation. This is acceptable: cache
        # invalidation is the goal; over-invalidation just wastes CI time
        # but never causes incorrect behavior.
        run: |
          set -e
          HASH=$(shasum -a 256 UnityFramework.xcframework.zip | awk '{print $1}')
          SHORT="${HASH:0:12}"
          echo "xcframework SHA-256: $HASH"

          # Identify as the bot for the commit
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # FIX (v187 Sprint): pull-rebase BEFORE writing the marker file.
          # Previous order was: write file → pull --rebase → fail because
          # rebase refuses with "You have unstaged changes". Now we pull
          # first to a clean tree, then write+commit+push.
          git pull --rebase origin master

          # Build JSON with printf (avoids heredoc indentation pitfalls in
          # YAML run blocks).
          printf '{\n  "release_tag": "unity-xcframework-latest",\n  "xcframework_sha256": "%s"\n}\n' "$HASH" > app/unity-release.json

          echo "=== marker file content ==="
          cat app/unity-release.json

          git add app/unity-release.json
          if git diff --cached --quiet; then
            echo "No marker change — xcframework SHA identical to last push (rare; only with deterministic zip)."
            exit 0
          fi

          git commit -m "chore(unity): bump xcframework marker to ${SHORT}"

          # Push with one retry (handles race: another commit landed between
          # pull and push). On retry, stash the marker, pull, re-apply,
          # commit again so we don't trip the same dirty-tree error.
          git push origin master || {
            git stash push -m "marker-retry-$$" -- app/unity-release.json
            git pull --rebase origin master
            git stash pop || true
            git add app/unity-release.json
            git commit --amend --no-edit -- app/unity-release.json 2>/dev/null \
              || git commit -m "chore(unity): bump xcframework marker to ${SHORT} (retry)"
            git push origin master
          }

      - name: Upload to GitHub Release
        # Runs ONLY if marker commit succeeded above (set -e + step ordering).
        # This guarantees Release content is never newer than marker.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unity-xcframework-latest
          name: Unity xcframework (latest)
          files: UnityFramework.xcframework.zip
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
