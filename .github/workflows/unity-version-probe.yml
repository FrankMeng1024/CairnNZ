name: Probe Unity image availability

# One-shot diagnostic workflow. Triggered manually only — never on push.
# Asks Docker Hub: does the unityci/editor image exist for the targeted
# Unity version + ios variant? Returns yes/no in ~10 seconds.
#
# Why this exists: we need to know if 6000.0.76f1 image is published
# without running a full Unity build (which would consume ~20 min and
# may fail for unrelated reasons). docker manifest inspect only does
# a HEAD request to the registry — no image is pulled.
#
# Delete this file after we've decided on the version.

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: "Unity version to probe (e.g. 6000.0.76f1)"
        required: true
        default: "6000.0.76f1"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe image
        run: |
          set +e
          for tag_pattern in \
            "ubuntu-${{ inputs.unityVersion }}-ios-3" \
            "ubuntu-${{ inputs.unityVersion }}-ios-3.2.2" \
            "ubuntu-${{ inputs.unityVersion }}-ios-3.1.0" \
            "${{ inputs.unityVersion }}-ios-3" \
            "${{ inputs.unityVersion }}-ios-3.2.2"; do
            echo "=== Probing unityci/editor:$tag_pattern ==="
            docker manifest inspect "unityci/editor:$tag_pattern" >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              echo "✓ FOUND: unityci/editor:$tag_pattern"
            else
              echo "✗ NOT FOUND"
            fi
          done

          echo ""
          echo "=== Sanity probe: 6000.0.36f1 (known to exist) ==="
          docker manifest inspect "unityci/editor:ubuntu-6000.0.36f1-ios-3" >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "✓ Sanity check passed: 36f1 image is reachable"
          else
            echo "✗ Sanity FAILED: 36f1 image not reachable — Docker Hub may be having issues"
          fi
