# Unity Personal License Activation
# Run this ONCE to get the .alf file needed to activate Unity Personal license.
# Steps:
#   1. Push this file and trigger the workflow (or use workflow_dispatch)
#   2. Download the artifact "unity-activation-file"
#   3. Go to https://license.unity3d.com/manual
#   4. Upload the .alf file → choose Unity Personal → download .ulf
#   5. Add GitHub Secrets:
#      - UNITY_LICENSE: paste the full .ulf file contents (XML text)
#      - UNITY_EMAIL: your Unity account email
#      - UNITY_PASSWORD: your Unity account password
#   6. Delete or disable this workflow after activation

name: Get Unity Activation File

on:
  workflow_dispatch:

jobs:
  get-activation-file:
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: getManualLicenseFile
        with:
          unityVersion: 6000.0.76f1

      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 7
