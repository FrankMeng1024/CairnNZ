<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>F4 — L1 fill (world minus circle) clean at all zooms?</title>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
<style>
  body { margin: 0; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiNzRqdHgiLCJhIjoiY21wOWQ3d3g0MG9zYTMzcHhraDQ2N3hiYyJ9.ICN7x0SsiUafGaN09Boy8w';
const map = new mapboxgl.Map({
  container: 'map', style: 'mapbox://styles/mapbox/outdoors-v12',
  center: [121.457, 31.232], zoom: 14,
});
window.map = map;
map.on('load', async () => {
  const data = await (await fetch('./F4_world_minus_circle.geojson')).json();
  map.addSource('fog-floor', { type: 'geojson', data });
  map.addLayer({
    id: 'fog-floor',
    type: 'fill',
    source: 'fog-floor',
    paint: {
      'fill-color': 'rgba(58, 42, 24, 0.66)',
      'fill-opacity': 1,
      'fill-antialias': true,
    },
  });
});
</script>
</body>
</html>
