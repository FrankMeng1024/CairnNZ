<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Spike D — Many small polygon holes</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
<script src="./gps-path.js"></script>
<style>
  body { margin:0; padding:0; }
  #map { width:1200px; height:800px; }
  #status { position:absolute; top:10px; left:10px; background:white; padding:6px 12px; font:14px monospace; z-index:10; }
</style>
</head>
<body>
<div id="status">loading...</div>
<div id="map"></div>
<script>
mapboxgl.accessToken = window.MAPBOX_TOKEN;
const urlParams = new URLSearchParams(window.location.search);
const zoom = parseFloat(urlParams.get('zoom') || '14');
const N = parseInt(urlParams.get('n') || '100', 10);

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: [121.46, 31.23],
  zoom: zoom,
  fadeDuration: 0
});

map.on('load', () => {
  const t0 = performance.now();
  try {
    // Generate N synthetic GPS points along/near the path, buffer each as
    // small circle (~15m radius), and use each as a hole. Multi-hole polygon.
    // The path is dense — spread N points within a ~1km box around center.
    const baseLng = 121.46, baseLat = 31.23;
    const span = 0.012; // ~1.3km E-W
    const holes = [];
    for (let i = 0; i < N; i++) {
      // pseudo-random walk
      const lng = baseLng - span/2 + (i * 0.000137) % span;
      const lat = baseLat - span/2 + ((i * 0.000191) % span);
      const pt = turf.point([lng, lat]);
      const buf = turf.buffer(pt, 15, { units: 'meters', steps: 8 });
      holes.push(buf.geometry.coordinates[0]);
    }

    const t1 = performance.now();

    const fogPolygon = {
      type: 'Feature',
      geometry: {
        type: 'Polygon',
        coordinates: [window.WORLD_RECT, ...holes]
      }
    };

    map.addSource('fog', { type: 'geojson', data: fogPolygon });
    map.addLayer({
      id: 'fog-fill',
      type: 'fill',
      source: 'fog',
      paint: {
        'fill-color': 'rgba(58,42,24,0.75)',
        'fill-antialias': false
      }
    });

    const t2 = performance.now();
    document.getElementById('status').textContent =
      'D: N=' + N + ' holes, zoom=' + zoom +
      ' — buffer=' + Math.round(t1-t0) + 'ms addLayer=' + Math.round(t2-t1) + 'ms';
    window.__SPIKE_READY = true;
    window.__SPIKE_D_STATS = { N, bufferMs: t1-t0, addMs: t2-t1 };
  } catch (e) {
    document.getElementById('status').textContent = 'ERROR: ' + e.message;
    window.__SPIKE_ERROR = e.message;
  }
});
map.on('error', (e) => {
  document.getElementById('status').textContent = 'MAP ERROR: ' + (e.error && e.error.message);
});
</script>
</body>
</html>
