server {
    server_name api.yiiling.cn;
    client_max_body_size 20m;

    location /fog-masks/ {
        alias /var/cairn/fog-masks/;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600" always;
        expires 1h;
        try_files $uri =404;
    }

    location = /pf-review-o60 {
        return 308 /pf-review-o60/;
    }

    # Dedicated synthetic owner-review realm. The trailing slash on
    # proxy_pass strips this public prefix before forwarding to the isolated
    # backend bound only on loopback.
    location /pf-review-o60/ {
        proxy_pass http://127.0.0.1:3008/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Production remains the default target.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.yiiling.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.yiiling.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.yiiling.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.yiiling.cn;
    client_max_body_size 20m;
    return 404; # managed by Certbot
}
