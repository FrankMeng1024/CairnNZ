<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cairn — Feature Map</title>
<link rel="icon" href="assets/favicon.ico" type="image/png">
<link rel="stylesheet" href="styles.css?v=59">
</head>
<body>

<!-- ══ Top Bar ══════════════════════════════════════════════════ -->
<div class="topbar">
  <div class="topbar-logo">
    <img class="topbar-logo-mark" src="assets/icon.svg" alt="Cairn" width="26" height="26">
    <span class="topbar-logo-text">Cairn</span>
    <span class="topbar-logo-sub">Feature Map</span>
  </div>
  <div class="topbar-sep"></div>
  <div class="tab-row" id="tabRow">
    <div class="tab active" data-view="view-overview">产品概览</div>
    <div class="tab"        data-view="view-story">故事地图</div>
    <div class="tab"        data-view="view-planning">发布排期</div>
  </div>
  <div class="topbar-right">
    <div class="legend-group">
      <div class="legend-row">
        <div class="legend-item" data-filter="done" data-tip="筛选已完成"><div class="legend-dot" style="background:var(--done)"></div>已完成</div>
        <div class="legend-item" data-filter="wip" data-tip="筛选进行中"><div class="legend-dot" style="background:var(--wip)"></div>进行中</div>
        <div class="legend-item" data-filter="p4" data-tip="筛选准备进行"><div class="legend-dot" style="background:var(--p4)"></div>准备进行</div>
        <div class="legend-item" data-filter="planned" data-tip="筛选计划中"><div class="legend-dot" style="background:var(--plan)"></div>计划中</div>
      </div>
      <div class="topbar-sep"></div>
    </div>
    <button class="toolbar-btn" id="themeBtn" data-toolbar="theme">☀️</button>
    <button class="toolbar-btn" id="editModeBtn" data-toolbar="edit-mode" data-tip="切换编辑模式">✎ 编辑</button>
    <button class="toolbar-btn" data-toolbar="help" data-tip="使用帮助">帮助</button>
  </div>
</div>

<!-- ══ Views ═════════════════════════════════════════════════════ -->
<div id="view-overview" class="view active"></div>
<div id="view-story"    class="view"></div>
<div id="view-planning" class="view"></div>
<!-- Scroll hint arrow (story map only) -->
<div id="story-scroll-hint">❯</div>

<!-- ══ Scripts ═══════════════════════════════════════════════════ -->
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/modal.js"></script>
<script src="js/dragdrop.js"></script>
<script src="js/view-overview.js"></script>
<script src="js/view-story.js"></script>
<script src="js/view-planning.js"></script>
<script src="js/app.js"></script>

</body>
</html>
