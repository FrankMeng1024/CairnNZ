<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cairn — Style B: Natural Warm</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #faf7f2; color: #2d2a26; max-width: 390px; margin: 0 auto; min-height: 844px; overflow-x: hidden; }

.status-bar { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 600; color: #5c5650; }

/* Header */
.header { padding: 0 20px 12px; }
.header h1 { font-size: 28px; font-weight: 700; color: #2d2a26; letter-spacing: -0.5px; }
.header .subtitle { font-size: 13px; color: #8c7e72; margin-top: 2px; }

/* Map */
.map-area { height: 380px; margin: 0 16px; border-radius: 20px; background: linear-gradient(160deg, #d4e4d1 0%, #e8dcc8 40%, #c5d4b8 100%); position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
.map-area::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(93,124,70,0.08) 50px, rgba(93,124,70,0.08) 51px), repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(93,124,70,0.08) 50px, rgba(93,124,70,0.08) 51px); }

.map-trail { position: absolute; top: 55%; left: 15%; width: 70%; height: 3px; background: #5d7c46; transform: rotate(-10deg); border-radius: 4px; opacity: 0.7; }
.map-trail::after { content: ''; position: absolute; top: -35px; left: 60%; width: 50%; height: 3px; background: #5d7c46; transform: rotate(25deg); border-radius: 4px; opacity: 0.7; }

/* Cairn markers (stacked stones visual) */
.cairn-marker { position: absolute; display: flex; flex-direction: column; align-items: center; }
.cairn-marker .stones { font-size: 16px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
.cairn-marker .label { font-size: 9px; margin-top: 2px; padding: 2px 6px; border-radius: 10px; font-weight: 500; }
.cm-danger { top: 30%; left: 40%; }
.cm-danger .label { background: #f4e0dc; color: #c53d2e; }
.cm-scenic { top: 50%; left: 68%; }
.cm-scenic .label { background: #dce8f4; color: #2e6cc5; }
.cm-supply { top: 42%; left: 25%; }
.cm-supply .label { background: #dcf4de; color: #2e8c3a; }

.user-pos { position: absolute; top: 48%; left: 52%; width: 14px; height: 14px; background: #5d7c46; border-radius: 50%; border: 3px solid #fff; transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(93,124,70,0.5); }

/* Route card */
.route-card { position: absolute; bottom: 12px; left: 12px; right: 12px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); border-radius: 14px; padding: 14px 16px; }
.route-card .name { font-size: 15px; font-weight: 600; color: #2d2a26; }
.route-card .detail { font-size: 12px; color: #8c7e72; margin-top: 4px; }
.route-card .stats-row { display: flex; gap: 20px; margin-top: 8px; }
.route-card .stat { text-align: center; }
.route-card .stat-val { font-size: 18px; font-weight: 700; color: #5d7c46; }
.route-card .stat-label { font-size: 10px; color: #8c7e72; }

/* Alert */
.alert-gentle { margin: 12px 16px 0; padding: 10px 14px; background: #fff3e0; border-radius: 12px; font-size: 12px; color: #b36b00; display: flex; align-items: center; gap: 8px; }

/* FAB */
.fab { position: absolute; bottom: 110px; right: 32px; width: 52px; height: 52px; border-radius: 16px; background: #5d7c46; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 16px rgba(93,124,70,0.35); border: none; color: #fff; }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 390px; height: 84px; background: #fff; display: flex; align-items: flex-start; justify-content: space-around; padding-top: 14px; border-top: 1px solid #ece6de; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #8c7e72; font-weight: 500; }
.nav-item.active { color: #5d7c46; }
.nav-icon { font-size: 20px; }

/* Mode toggle */
.mode-toggle { display: flex; margin: 12px 16px 0; background: #ece6de; border-radius: 12px; padding: 4px; }
.mode-btn { flex: 1; text-align: center; padding: 8px; border-radius: 10px; font-size: 13px; font-weight: 500; color: #8c7e72; }
.mode-btn.active { background: #fff; color: #5d7c46; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
</style>
</head>
<body>
<div class="status-bar">
  <span>9:41</span>
  <span style="font-size:11px; color:#5d7c46;">● Tracking</span>
  <span>🔋 87%</span>
</div>

<div class="header">
  <h1>Cairn</h1>
  <div class="subtitle">Tongariro Alpine Crossing</div>
</div>

<div class="mode-toggle">
  <div class="mode-btn active">🥾 Hiking</div>
  <div class="mode-btn">🏃 Running</div>
</div>

<div class="alert-gentle">☁️ Wind advisory in effect — gusts up to 80km/h above 1500m</div>

<div class="map-area" style="margin-top:12px;">
  <div class="map-trail"></div>
  <div class="cairn-marker cm-danger"><span class="stones">🪨🪨</span><span class="label">Slippery</span></div>
  <div class="cairn-marker cm-scenic"><span class="stones">🏔️</span><span class="label">Vista</span></div>
  <div class="cairn-marker cm-supply"><span class="stones">💧</span><span class="label">Water</span></div>
  <div class="user-pos"></div>
  <div class="route-card">
    <div class="name">Your progress</div>
    <div class="stats-row">
      <div class="stat"><div class="stat-val">4.2</div><div class="stat-label">km</div></div>
      <div class="stat"><div class="stat-val">1:23</div><div class="stat-label">time</div></div>
      <div class="stat"><div class="stat-val">780</div><div class="stat-label">m elev</div></div>
      <div class="stat"><div class="stat-val">3</div><div class="stat-label">marks</div></div>
    </div>
  </div>
  <button class="fab">🚩</button>
</div>

<div class="bottom-nav">
  <div class="nav-item active"><span class="nav-icon">🗺️</span>Map</div>
  <div class="nav-item"><span class="nav-icon">🚩</span>Marks</div>
  <div class="nav-item"><span class="nav-icon">👥</span>Friends</div>
  <div class="nav-item"><span class="nav-icon">⚙️</span>Settings</div>
</div>
</body>
</html>
