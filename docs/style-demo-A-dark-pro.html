<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cairn — Style A: Outdoor Pro (Dark)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #0d1117; color: #e6edf3; max-width: 390px; margin: 0 auto; min-height: 844px; overflow-x: hidden; }

/* Status bar */
.status-bar { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 600; }

/* Map area */
.map-area { height: 420px; background: linear-gradient(135deg, #1a2332 0%, #0d1f1a 50%, #1a2332 100%); position: relative; overflow: hidden; }
.map-area::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(46,160,67,0.05) 40px, rgba(46,160,67,0.05) 41px), repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(46,160,67,0.05) 40px, rgba(46,160,67,0.05) 41px); }
.map-trail { position: absolute; top: 50%; left: 20%; width: 60%; height: 2px; background: linear-gradient(90deg, #2ea043, #58a6ff); transform: rotate(-15deg); border-radius: 2px; box-shadow: 0 0 8px rgba(46,160,67,0.4); }
.map-trail::after { content: ''; position: absolute; top: -40px; left: 70%; width: 60%; height: 2px; background: linear-gradient(90deg, #58a6ff, #2ea043); transform: rotate(30deg); border-radius: 2px; box-shadow: 0 0 8px rgba(88,166,255,0.4); }

/* Flag markers */
.flag { position: absolute; width: 12px; height: 12px; border-radius: 50%; animation: pulse 2s infinite; }
.flag-danger { background: #f85149; top: 35%; left: 45%; box-shadow: 0 0 12px rgba(248,81,73,0.6); }
.flag-scenic { background: #58a6ff; top: 55%; left: 65%; box-shadow: 0 0 12px rgba(88,166,255,0.6); }
.flag-supply { background: #2ea043; top: 45%; left: 30%; box-shadow: 0 0 12px rgba(46,160,67,0.6); }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } }

/* User position */
.user-pos { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; background: #fff; border-radius: 50%; border: 3px solid #58a6ff; transform: translate(-50%, -50%); box-shadow: 0 0 20px rgba(88,166,255,0.8); }

/* Info overlay */
.info-overlay { position: absolute; bottom: 16px; left: 16px; right: 16px; background: rgba(13,17,23,0.9); backdrop-filter: blur(10px); border-radius: 12px; padding: 12px 16px; border: 1px solid rgba(88,166,255,0.2); }
.info-overlay .route-name { font-size: 13px; color: #58a6ff; font-weight: 600; }
.info-overlay .stats { display: flex; gap: 16px; margin-top: 6px; font-size: 11px; color: #8b949e; }
.info-overlay .stats span { color: #2ea043; font-weight: 600; }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 390px; height: 84px; background: rgba(13,17,23,0.95); backdrop-filter: blur(20px); display: flex; align-items: flex-start; justify-content: space-around; padding-top: 12px; border-top: 1px solid rgba(88,166,255,0.1); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #8b949e; }
.nav-item.active { color: #2ea043; }
.nav-icon { width: 24px; height: 24px; border-radius: 6px; background: rgba(88,166,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.nav-item.active .nav-icon { background: rgba(46,160,67,0.2); }

/* Action button */
.action-btn { position: absolute; bottom: 100px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #2ea043, #238636); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 20px rgba(46,160,67,0.4); border: none; color: #fff; }

/* Alert bar */
.alert-bar { background: rgba(248,81,73,0.15); border: 1px solid rgba(248,81,73,0.3); margin: 8px 16px; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #f85149; display: flex; align-items: center; gap: 8px; }
.alert-bar::before { content: '⚠️'; }

/* Mode indicator */
.mode-indicator { display: flex; margin: 8px 16px; gap: 8px; }
.mode-pill { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; }
.mode-pill.active { background: rgba(46,160,67,0.2); color: #2ea043; border: 1px solid rgba(46,160,67,0.4); }
.mode-pill.inactive { background: rgba(139,148,158,0.1); color: #8b949e; border: 1px solid rgba(139,148,158,0.2); }
</style>
</head>
<body>
<div class="status-bar">
  <span>9:41</span>
  <span style="color:#2ea043;font-size:12px;">● GPS Active</span>
  <span>🔋 87%</span>
</div>

<div class="mode-indicator">
  <div class="mode-pill active">🥾 Hiking</div>
  <div class="mode-pill inactive">🏃 Running</div>
</div>

<div class="alert-bar">DOC Warning: Tongariro Crossing — high wind advisory today</div>

<div class="map-area">
  <div class="map-trail"></div>
  <div class="flag flag-danger"></div>
  <div class="flag flag-scenic"></div>
  <div class="flag flag-supply"></div>
  <div class="user-pos"></div>
  <div class="info-overlay">
    <div class="route-name">Tongariro Alpine Crossing</div>
    <div class="stats">
      <div><span>4.2km</span> covered</div>
      <div><span>1:23</span> elapsed</div>
      <div><span>3</span> markers</div>
    </div>
  </div>
  <button class="action-btn">🚩</button>
</div>

<div class="bottom-nav">
  <div class="nav-item active"><div class="nav-icon">🗺️</div>Map</div>
  <div class="nav-item"><div class="nav-icon">🚩</div>Marks</div>
  <div class="nav-item"><div class="nav-icon">👥</div>Friends</div>
  <div class="nav-item"><div class="nav-icon">⚙️</div>Settings</div>
</div>
</body>
</html>
