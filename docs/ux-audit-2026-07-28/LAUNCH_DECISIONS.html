<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cairn 上线前问题清单 — 按功能</title>
<style>
  :root {
    --bg: #f5efe4;
    --card: #faf6ec;
    --ink: #3a342c;
    --muted: #7c7367;
    --line: #d9cfba;
    --accent: #6b8858;
    --danger: #a55a4c;
    --warn: #b5893e;
    --ok: #6b8858;
    --info: #6b7f95;
  }
  * { box-sizing: border-box; }
  html { font-size: 17px; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }
  aside {
    background: var(--card);
    border-right: 1px solid var(--line);
    padding: 24px 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  aside h2 {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    padding: 12px 14px;
    margin-bottom: 4px;
    border-radius: 10px;
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    line-height: 1.5;
    font-family: inherit;
  }
  .nav-btn:hover { background: rgba(107, 136, 88, 0.08); }
  .nav-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .nav-btn .count {
    float: right;
    font-size: 12px;
    opacity: 0.7;
    padding-top: 4px;
  }
  .nav-btn.active .count { opacity: 1; }
  main {
    padding: 40px 48px 120px;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
  }
  .topbar .progress {
    font-size: 14px;
    color: var(--muted);
  }
  .topbar .progress b { color: var(--accent); font-size: 18px; }
  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  button.primary, button.secondary {
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { opacity: 0.92; }
  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 28px;
    margin-bottom: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }
  .item[data-decided="1"] {
    border-left: 4px solid var(--accent);
  }
  .item .head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .item .id {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    background: rgba(0,0,0,0.04);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .item .title {
    font-size: 19px;
    font-weight: 600;
    flex: 1;
    line-height: 1.4;
  }
  .item .pill {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(0,0,0,0.05);
    color: var(--muted);
  }
  .pill.Blocker { background: rgba(165, 90, 76, 0.15); color: var(--danger); }
  .pill.Critical { background: rgba(181, 137, 62, 0.15); color: var(--warn); }
  .pill.Medium { background: rgba(107, 136, 88, 0.15); color: var(--accent); }
  .pill.Low { background: rgba(0,0,0,0.06); color: var(--muted); }
  .item .body {
    font-size: 16px;
    line-height: 1.75;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .item .meta {
    font-size: 14px;
    color: var(--muted);
    margin: 6px 0;
    line-height: 1.65;
  }
  .item .meta b { color: var(--ink); font-weight: 600; }
  .decision-block {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px dashed var(--line);
  }
  .decision-block .label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .decision-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .decision-row button {
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
    font-family: inherit;
    line-height: 1.4;
  }
  .decision-row button:hover { border-color: var(--accent); }
  .decision-row button.selected {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .decision-row button[data-value="skip"].selected {
    background: var(--muted);
    border-color: var(--muted);
  }
  .decision-row button[data-value="v11"].selected,
  .decision-row button[data-value="later"].selected {
    background: var(--warn);
    border-color: var(--warn);
  }
  .decision-row button[data-value="ask"].selected {
    background: var(--info);
    border-color: var(--info);
  }
  .notes-block {
    margin-top: 14px;
  }
  .notes-wrap {
    position: relative;
  }
  .notes-block textarea {
    width: 100%;
    min-height: 60px;
    padding: 12px 48px 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.65;
    resize: vertical;
    background: var(--bg);
    color: var(--ink);
  }
  .notes-block textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  .notes-block label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }
  .mic-btn {
    position: absolute;
    right: 8px;
    top: 8px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: var(--muted);
    transition: all 0.15s;
    font-family: inherit;
  }
  .mic-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .mic-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(165, 90, 76, 0.5); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(165, 90, 76, 0); }
  }
  .mic-btn svg { width: 18px; height: 18px; }
  .mic-hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    min-height: 18px;
  }
  .mic-hint.active { color: var(--danger); }
  .mic-hint.error { color: var(--warn); }
  .intro {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 28px;
    margin-bottom: 24px;
    line-height: 1.8;
  }
  .intro h2 {
    margin: 0 0 12px;
    font-size: 20px;
  }
  .intro ul {
    margin: 8px 0 0 20px;
    padding: 0;
    color: var(--muted);
  }
  .intro li { margin-bottom: 8px; font-size: 15px; }
  .intro b { color: var(--ink); }
  .section-header {
    margin-bottom: 20px;
  }
  .section-header h2 {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 600;
  }
  .section-header p {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 24px 20px 80px; }
  }
</style>
</head>
<body>

<div class="layout">

<aside>
  <h2>按功能分类</h2>
  <div id="nav"></div>
  <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line);">
    <button class="primary" id="export-btn" style="width:100%; margin-bottom:8px;">导出我的决定</button>
    <button class="secondary" id="reset-btn" style="width:100%;">清空重来</button>
  </div>
</aside>

<main>

<div class="topbar">
  <h1 id="section-title">开始</h1>
  <div class="progress">已决定 <b id="progress">0</b> / <span id="total">0</span></div>
</div>

<div id="content"></div>

</main>

</div>

const LSK = "cairn-launch-audit-v2";
const load = () => { try { return JSON.parse(localStorage.getItem(LSK) || "{}"); } catch { return {}; } };
const save = (id, decision, notes) => {
  const s = load();
  s[id] = { decision, notes, ts: Date.now() };
  localStorage.setItem(LSK, JSON.stringify(s));
  updateProgress();
  updateNavCounts();
};

// Flatten
let allItems = [];
GROUPS.forEach(g => { if (g.items) g.items.forEach(it => allItems.push({ ...it, groupKey: g.key })); });
document.getElementById("total").textContent = allItems.length;

// Nav
const nav = document.getElementById("nav");
GROUPS.forEach(g => {
  if (g.hide) return;
  const btn = document.createElement("button");
  btn.className = "nav-btn";
  btn.dataset.key = g.key;
  const total = (g.items || []).length;
  btn.innerHTML = `${g.name} <span class="count" data-count="${g.key}">0/${total}</span>`;
  btn.addEventListener("click", () => showGroup(g.key));
  nav.appendChild(btn);
});

          <li>先看 <b>账户</b> + <b>上架素材</b> — 决定能不能上架的硬门槛</li>
          <li>再看 <b>首次引导</b> + <b>徒步/跑步</b> — 用户第一次用会不会摔跤</li>
          <li>再看 <b>数据安全</b> + <b>推送</b> — 上线后会不会出事</li>

// ─── Voice input (Web Speech API) ────────────────────────────────
// One global recognizer; only one mic active at a time.
let currentRec = null;
let currentMicBtn = null;
let baseText = ""; // Text in textarea when recording started
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setHint(id, text, cls) {
  const hint = document.querySelector(`[data-mic-hint="${id}"]`);
  if (!hint) return;
  hint.textContent = text || "";
  hint.className = "mic-hint" + (cls ? " " + cls : "");
}

function stopCurrentMic() {
  if (currentRec) {
    try { currentRec.stop(); } catch {}
    currentRec = null;
  }
  if (currentMicBtn) {
    currentMicBtn.classList.remove("listening");
    currentMicBtn = null;
  }
}

function toggleMic(btn) {
  const id = btn.dataset.mic;

  // If this button is already recording -> stop
  if (currentMicBtn === btn) {
    stopCurrentMic();
    setHint(id, "已停止", "");
    setTimeout(() => setHint(id, "", ""), 1500);
    return;
  }

  // If another button is recording -> stop it first
  stopCurrentMic();

  if (!SR) {
    setHint(id, "此浏览器不支持语音输入. 试试 Chrome / Edge / Safari.", "error");
    return;
  }

  const ta = document.querySelector(`textarea[data-notes="${id}"]`);
  if (!ta) return;
  baseText = ta.value;

  const rec = new SR();
  rec.lang = "zh-CN";
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  let finalText = "";

  rec.onstart = () => {
    setHint(id, "🎙 正在听... 再点一下停止", "active");
  };

  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        finalText += t;
      } else {
        interim += t;
      }
    }
    const sep = baseText && !baseText.endsWith(" ") && !baseText.endsWith("\n") ? " " : "";
    ta.value = baseText + sep + finalText + interim;
    // Save on every update
    const row = document.querySelector(`.decision-row[data-id="${id}"]`);
    const selBtn = row ? row.querySelector("button.selected") : null;
    save(id, selBtn ? selBtn.dataset.value : null, ta.value);
  };

  rec.onerror = (e) => {
    let msg = "出错了: " + e.error;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      msg = "麦克风权限被拒. 到浏览器地址栏🔒图标里打开.";
    } else if (e.error === "no-speech") {
      msg = "没听到声音. 再试一下.";
    } else if (e.error === "network") {
      msg = "网络问题 (语音识别需要联网).";
    }
    setHint(id, msg, "error");
    stopCurrentMic();
  };

  rec.onend = () => {
    if (currentMicBtn === btn) {
      // Ended unexpectedly (auto-timeout etc)
      currentMicBtn.classList.remove("listening");
      currentMicBtn = null;
      currentRec = null;
      setHint(id, "已停止. 再点重新开始.", "");
    }
  };

  try {
    rec.start();
    currentRec = rec;
    currentMicBtn = btn;
    btn.classList.add("listening");
  } catch (err) {
    setHint(id, "启动失败: " + err.message, "error");
  }
}

function updateProgress() {
  const s = load();
  const done = Object.keys(s).filter(k => s[k].decision).length;
  document.getElementById("progress").textContent = done;
}

function updateNavCounts() {
  const s = load();
  GROUPS.forEach(g => {
    if (!g.items) return;
    const done = g.items.filter(it => s[it.id] && s[it.id].decision).length;
    const el = document.querySelector(`.count[data-count="${g.key}"]`);
    if (el) el.textContent = `${done}/${g.items.length}`;
  });
}

// Reset
document.getElementById("reset-btn").addEventListener("click", () => {
  if (!confirm("确定清空所有决定?")) return;
  localStorage.removeItem(LSK);
  location.reload();
});

// Export
document.getElementById("export-btn").addEventListener("click", () => {
  const s = load();
  const out = { ts: new Date().toISOString(), decisions: {}, summary: { by_decision: {}, by_group: {} } };
  allItems.forEach(it => {
    const rec = s[it.id];
    if (rec && rec.decision) {
      out.decisions[it.id] = { title: it.title, severity: it.severity, group: it.groupKey, decision: rec.decision, notes: rec.notes || "" };
      out.summary.by_decision[rec.decision] = (out.summary.by_decision[rec.decision] || 0) + 1;
      out.summary.by_group[it.groupKey] = (out.summary.by_group[it.groupKey] || 0) + 1;
    }
  });
  out.summary.total = allItems.length;
  out.summary.decided = Object.keys(out.decisions).length;
  const json = JSON.stringify(out, null, 2);
  const w = window.open("", "_blank");
  w.document.write(`<!DOCTYPE html><html><head><title>Cairn decisions</title><style>body{font-family:sans-serif;padding:24px;background:#f5efe4;color:#3a342c;}textarea{width:100%;height:80vh;font-family:monospace;font-size:13px;line-height:1.5;padding:12px;background:#faf6ec;border:1px solid #d9cfba;border-radius:8px;}</style></head><body><p><b>${out.summary.decided}</b> / ${out.summary.total} 条已决定. 复制下面全部内容发给 Claude:</p><textarea>${json.replace(/</g, "&lt;")}</textarea></body></html>`);
});

// Init
showGroup("overview");
updateNavCounts();
updateProgress();
