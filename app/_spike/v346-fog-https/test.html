<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>v346 fog-mask https spike</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: monospace; }
    #map { height: 500px; width: 100%; }
    #status { padding: 10px; background: #111; color: #0f0; }
  </style>
</head>
<body>
  <div id="status">init</div>
  <div id="map"></div>
  <script>
    const setStatus = (s) => { document.getElementById('status').textContent = s; console.log('[STATUS]', s); };
    mapboxgl.accessToken = 'pk.eyJ1IjoiNzRqdHgiLCJhIjoiY21wOWQ3d3g0MG9zYTMzcHhraDQ2N3hiYyJ9.ICN7x0SsiUafGaN09Boy8w';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: [121.46, 31.23],
      zoom: 13
    });
    map.on('load', () => {
      setStatus('map loaded, adding image source...');
      map.addSource('test-fog', {
        type: 'image',
        url: 'https://api.yiiling.cn/fog-masks/test-1024.png',
        coordinates: [
          [121.44, 31.24],
          [121.48, 31.24],
          [121.48, 31.22],
          [121.44, 31.22]
        ]
      });
      map.addLayer({
        id: 'test-fog-layer',
        type: 'raster',
        source: 'test-fog',
        paint: { 'raster-opacity': 1, 'raster-fade-duration': 0 }
      });
      setStatus('layer added, waiting for source data...');
    });
    map.on('sourcedata', (e) => {
      if (e.sourceId === 'test-fog' && e.isSourceLoaded) {
        setStatus('SUCCESS: test-fog source loaded from https URL');
      }
    });
    map.on('error', (e) => {
      setStatus('ERROR: ' + (e.error && e.error.message ? e.error.message : JSON.stringify(e)));
    });
  </script>
</body>
</html>
